[project]
name = "regtaxpassports"
version = "0.1.0"
description = "Сбор и структурирование налоговых паспортов субъектов РФ с аналитического портала ФНС России"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx[socks]>=0.27",
    "xlrd>=2.0",
    "duckdb>=1.1",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# тетрадка с примерами docs/examples.ipynb
notebook = ["pandas>=2.2", "matplotlib>=3.8", "jupyterlab>=4"]

[project.scripts]
regtaxpassports = "regtaxpassports.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["regtaxpassports"]
